
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090909">

  <title>Shriya Group | Upcoming</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;

      background:
        radial-gradient(
          ellipse at center,
          rgba(177, 132, 54, 0.09),
          transparent 65%
        ),
        #090909;

      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    main {
      position: relative;

      width: 88%;
      max-width: 900px;
      height: min(70vh, 560px);

      display: flex;
      justify-content: center;
      align-items: center;

      border: 1px solid rgba(214, 180, 106, 0.22);
    }

    /* Golden corner details */
    main::before,
    main::after {
      content: "";
      position: absolute;
      width: 34px;
      height: 34px;
      border-color: #d6b46a;
      border-style: solid;
      opacity: 0.85;
    }

    main::before {
      top: -1px;
      left: -1px;
      border-width: 1px 0 0 1px;
    }

    main::after {
      bottom: -1px;
      right: -1px;
      border-width: 0 1px 1px 0;
    }

    h1 {
      width: 100%;
      text-align: center;
      white-space: nowrap;

      color: #d6b46a;

      font-size: clamp(2rem, 8vw, 7rem);
      font-weight: 500;

      letter-spacing: clamp(0.06em, 1.1vw, 0.16em);
      line-height: 1;

      padding: 0 12px;

      text-shadow:
        0 0 25px rgba(214, 180, 106, 0.15);
    }

    /* Mobile responsiveness */
    @media (max-width: 480px) {
      main {
        width: 92%;
        height: 55vh;
      }

      h1 {
        font-size: clamp(1.8rem, 8vw, 2.8rem);
        letter-spacing: 0.07em;
        padding: 0 8px;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>UPCOMING</h1>
  </main>
</body>
</html>
