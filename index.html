<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090909" />
  <meta name="description" content="Shriya Group — Upcoming." />
  <title>Shriya Group | Upcoming</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --gold: #d6b46a; }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 45%, rgba(177, 132, 54, .10) 0%, rgba(177, 132, 54, .035) 27%, transparent 59%),
        #090909;
      font-family: 'Cormorant Garamond', Georgia, serif;
    }
    main {
      position: relative;
      display: grid;
      place-items: center;
      width: min(88vw, 900px);
      min-height: min(70vh, 560px);
      border: 1px solid rgba(214, 180, 106, .22);
    }
    main::before, main::after {
      content: '';
      position: absolute;
      width: 34px;
      height: 34px;
      border-color: var(--gold);
      opacity: .8;
    }
    main::before { top: -1px; left: -1px; border-top: 1px solid; border-left: 1px solid; }
    main::after { right: -1px; bottom: -1px; border-right: 1px solid; border-bottom: 1px solid; }
    h1 {
      margin: 0;
      padding: 0 18px;
      color: var(--gold);
      font-size: clamp(3.4rem, 11vw, 8.5rem);
      font-weight: 500;
      letter-spacing: .16em;
      line-height: 1;
      text-align: center;
      text-indent: .16em;
      text-shadow: 0 0 34px rgba(214, 180, 106, .13);
    }
    @media (max-width: 480px) {
      main { min-height: 56vh; }
      h1 { letter-spacing: .10em; text-indent: .10em; }
    }
  </style>
</head>
<body>
  <main aria-label="Shriya Group">
    <h1>UPCOMING</h1>
  </main>
</body>
</html>
